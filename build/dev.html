<!DOCTYPE html>
<html lang="en">
    <head>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Sleepy Unicorn on Upbeat Rainbow Road</title>
        <style>
            body,
            html {
                display: flex;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #999;
            }

            canvas {
                margin: auto;
                width: 100%;
                height: auto;
                align-self: center;
                justify-self: center;
                background: #000
            }

            * {
                touch-action: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            }

            @media (min-aspect-ratio: 9 / 16) {
                canvas {
                    width: auto;
                    height: 100%;
                }
            }
        </style>
    </head>

    <body data-prefix="suourr_">
        <canvas width="144" height="256"></canvas>
    </body>

    <script src="main.js"></script>
</html>
